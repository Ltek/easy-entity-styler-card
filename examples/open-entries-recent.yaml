title: Entries
entity_filter_texts: []
entity_filter_types:
  - text
entity_filter_labels: []
entity_filter_groups: []
sections:
  - id: sec_entries_group
    type: group
    name: Open Entries
    children:
      - id: sec_locks
        type: cards
        name: Locks
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: lock.mudroom_deadbolt
                name: Mudroom
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: call-service
                  service: >-
                    [[[ return entity.state === 'locked' ? 'lock.unlock' :
                    'lock.lock'; ]]]
                  service_data:
                    entity_id: lock.mudroom_deadbolt
                icon: >-
                  [[[ return entity.state === 'locked' ? 'mdi:lock' :
                  'mdi:lock-open-variant'; ]]]
                label: |
                  [[[
                    const lastChanged = new Date(entity.last_changed);
                    const now = new Date();

                    let eventHour = lastChanged.getHours();
                    const eventMinutes = lastChanged.getMinutes();
                    const eventAmpm = eventHour >= 12 ? 'PM' : 'AM';
                    eventHour = eventHour % 12 || 12;
                    const formattedEventTime = `${eventHour}:${eventMinutes.toString().padStart(2, '0')} ${eventAmpm}`;

                    const diffMs = now - lastChanged;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const remainingMins = diffMins % 60;

                    let timeAgo;
                    if (diffMins < 1) {
                      timeAgo = 'just now';
                    } else if (diffHours === 0) {
                      timeAgo = `${diffMins}m ago`;
                    } else if (remainingMins === 0) {
                      timeAgo = `${diffHours}h ago`;
                    } else {
                      timeAgo = `${diffHours}h ${remainingMins}m ago`;
                    }

                    return `${formattedEventTime} - ${timeAgo}`;
                  ]]]
                styles:
                  card:
                    - height: 60px
                    - background-color: transparent
                    - box-shadow: none
                    - border: none
                    - border-radius: 12px
                    - padding: 0px
                  grid:
                    - grid-template-areas: '". i n ." ". i l ."'
                    - grid-template-columns: 1fr 30px auto 1fr
                    - grid-template-rows: 1fr 1fr
                  img_cell:
                    - justify-content: center
                    - align-items: center
                  icon:
                    - width: 32px
                    - color: >-
                        [[[ return entity.state === 'locked' ? 'green' :
                        '#eab308'; ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 16px
                    - color: white
                    - margin-left: 8px
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 14px
                    - color: grey
                    - margin-left: 8px
                    - margin-top: 4px
              - type: custom:button-card
                entity: lock.front_door_deadbolt
                name: Front Door
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                tap_action:
                  action: call-service
                  service: >-
                    [[[ return entity.state === 'locked' ? 'lock.unlock' :
                    'lock.lock'; ]]]
                  service_data:
                    entity_id: lock.front_door_deadbolt
                icon: >-
                  [[[ return entity.state === 'locked' ? 'mdi:lock' :
                  'mdi:lock-open-variant'; ]]]
                label: |
                  [[[
                    const lastChanged = new Date(entity.last_changed);
                    const now = new Date();

                    let eventHour = lastChanged.getHours();
                    const eventMinutes = lastChanged.getMinutes();
                    const eventAmpm = eventHour >= 12 ? 'PM' : 'AM';
                    eventHour = eventHour % 12 || 12;
                    const formattedEventTime = `${eventHour}:${eventMinutes.toString().padStart(2, '0')} ${eventAmpm}`;

                    const diffMs = now - lastChanged;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const remainingMins = diffMins % 60;

                    let timeAgo;
                    if (diffMins < 1) {
                      timeAgo = 'just now';
                    } else if (diffHours === 0) {
                      timeAgo = `${diffMins}m ago`;
                    } else if (remainingMins === 0) {
                      timeAgo = `${diffHours}h ago`;
                    } else {
                      timeAgo = `${diffHours}h ${remainingMins}m ago`;
                    }

                    return `${formattedEventTime} - ${timeAgo}`;
                  ]]]
                styles:
                  card:
                    - height: 60px
                    - background-color: transparent
                    - box-shadow: none
                    - border: none
                    - border-radius: 12px
                    - padding: 0px
                  grid:
                    - grid-template-areas: '". i n ." ". i l ."'
                    - grid-template-columns: 1fr 30px auto 1fr
                    - grid-template-rows: 1fr 1fr
                  img_cell:
                    - justify-content: center
                    - align-items: center
                  icon:
                    - width: 32px
                    - color: >-
                        [[[ return entity.state === 'locked' ? 'green' :
                        '#eab308'; ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 16px
                    - color: white
                    - margin-left: 8px
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 13px
                    - color: grey
                    - margin-left: 8px
                    - margin-top: 4px
