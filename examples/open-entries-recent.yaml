rule_sets:
  - id: rs_open_doors
    name: Open doors
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: door
            - field: state
              op: is_on
            - field: visibility
              op: ne
              value: hidden
            - field: integration
              op: ne
              value: ha_kia_hyundai
  - id: rs_open_windows
    name: Open windows
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: window
            - field: state
              op: is_on
            - field: visibility
              op: ne
              value: hidden
  - id: rs_open_garage
    name: Open garage doors
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: garage
            - field: state
              op: eq
              value: open
            - field: visibility
              op: ne
              value: hidden
  - id: rs_unlocked_locks
    name: Unlocked locks
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: domain
              op: eq
              value: lock
            - field: state
              op: eq
              value: unlocked
            - field: visibility
              op: ne
              value: hidden
            - field: name
              op: not_contains
              value:
                - gdo
            - field: integration
              op: ne
              value: ha_kia_hyundai
            - field: name
              op: not_contains
              value:
                - group
  - id: rs_all_doors
    name: All doors (open + recently closed)
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: door
            - field: visibility
              op: ne
              value: hidden
            - field: integration
              op: ne
              value: ha_kia_hyundai
  - id: rs_all_windows
    name: All windows (open + recently closed)
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: window
            - field: visibility
              op: ne
              value: hidden
  - id: rs_all_garage
    name: All garage doors (open + recently closed)
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: device_class
              op: eq
              value: garage
            - field: visibility
              op: ne
              value: hidden
  - id: rs_all_locks
    name: All locks (unlocked + recently locked)
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: domain
              op: eq
              value: lock
            - field: visibility
              op: ne
              value: hidden
            - field: name
              op: not_contains
              value:
                - gdo
            - field: integration
              op: ne
              value: ha_kia_hyundai
            - field: name
              op: not_contains
              value:
                - group
