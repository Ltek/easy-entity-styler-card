rule_sets:
  - id: rs_gen_sec
    name: Shades — filter
    filter:
      groups:
        - mode: include
          match: all
          rules:
            - field: domain
              op: eq
              value: cover
        - mode: exclude
          match: any
          rules:
            - field: entity_id
              op: contains
              values:
                - group
                - garage
            - field: name
              op: contains
              values:
                - group
                - garage
            - field: device_class
              op: eq
              value: garage
